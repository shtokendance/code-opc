<!doctype html>
<html lang="en" class="h-full">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Multica</title>
    <script>
      // Load Wails v3 runtime dynamically at browser runtime
      window.__wails_ready__ = import(/* @vite-ignore */ "/wails/runtime.js")
        .then((mod) => {
          window.wails = window.wails || {};
          Object.assign(window.wails, mod);
          return mod;
        })
        .catch((err) => {
          console.warn("Dynamic import of /wails/runtime.js failed:", err);
          return null;
        });
    </script>
  </head>
  <body class="h-full overflow-hidden antialiased font-sans">
    <div id="root" class="h-full"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
